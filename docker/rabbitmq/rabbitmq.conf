# https://github.com/rabbitmq/rabbitmq-server/blob/main/deps/rabbit/docs/rabbitmq.conf.example
# environment variable interpolation
default_user = $(SEED_USERNAME)
default_pass = $(SEED_USER_PASSWORD)

log.console = true
log.console.level = info
log.file.level = info

# в миллисекундах
handshake_timeout = 10000

vm_memory_high_watermark.relative = 0.6
vm_memory_high_watermark.absolute = 4GB

disk_free_limit.absolute = 16GB

heartbeat = 60

listeners.tcp.local              = 5672
listeners.ssl.default            = 5671
listeners.ssl.1                  = 5671
ssl_options.verify               = verify_peer
ssl_options.fail_if_no_peer_cert = false
ssl_options.cacertfile = /etc/ssl/rabbitmq/chain.pem
ssl_options.certfile   = /etc/ssl/rabbitmq/cert.pem
ssl_options.keyfile    = /etc/ssl/rabbitmq/privkey.pem

# management.listener.ssl = true
management.listener.port = 15672
