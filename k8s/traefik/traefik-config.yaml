# https://docs.k3s.io/add-ons/helm#customizing-packaged-components-with-helmchartconfig 
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  # https://raw.githubusercontent.com/traefik/traefik-helm-chart/refs/heads/master/traefik/values.yaml 
  valuesContent: |-
    service:
      annotations:
        metallb.io/allow-shared-ip: ingress-traefik
