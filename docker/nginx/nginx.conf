worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include mime.types;
  default_type application/octet-stream;

  sendfile on;
  keepalive_timeout  65;

  server {
    server_name s3.senioravanti.ru;
    include /etc/nginx/server_https2.conf;
    
    client_max_body_size 0;

    location / {
      proxy_pass http://garage:3900;
      include /etc/nginx/proxy.conf;

      proxy_http_version 1.1;
      proxy_set_header Connection "";
      chunked_transfer_encoding off;

      proxy_max_temp_file_size 0;
    }
  }
  
  server {
    server_name photos.senioravanti.ru;
    include /etc/nginx/server_https2.conf;

    client_max_body_size 50000M;
    client_body_buffer_size 1024k;
    
    include /etc/nginx/proxy.conf;
    proxy_redirect     off;
    proxy_set_header X-Real-IP         $remote_addr;

    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    send_timeout       600s;

    location / {
      proxy_pass http://immich-server:2283;
      include /etc/nginx/ws.conf;
    }
  }

  server {
    server_name auth.senioravanti.ru;
    include /etc/nginx/server_https2.conf;
    http2 on;

    location / {
      proxy_pass http://auth-service:27182;
      include /etc/nginx/proxy.conf;
    }
  }

  server {
    server_name caffegql.senioravanti.ru;
    include /etc/nginx/server_https2.conf;
    http2 on;

    location / {
      proxy_pass http://caffegql:60221/graphql;
      include /etc/nginx/proxy.conf;
    }
  }

  server {
    server_name s3service.senioravanti.ru;
    include /etc/nginx/server_https2.conf;
    http2 on;

    location / {
      proxy_pass http://s3-service:60222;
      include /etc/nginx/proxy.conf;
    }
  }

  server {
    server_name caffe.senioravanti.ru;
    include /etc/nginx/server_https2.conf;
    http2 on;

    location / {
      proxy_pass http://caffe:80;
      include /etc/nginx/proxy.conf;
    }
  }

  server {
    server_name helpdesk.senioravanti.ru;
    include /etc/nginx/server_https2.conf;
    http2 on;

    location / {
      proxy_pass http://helpdesk:26491;
      include /etc/nginx/proxy.conf;
    }

    location /api/v1/events {
      proxy_pass http://helpdesk:26491;
      include /etc/nginx/ws.conf;
      proxy_read_timeout 86400;
    }
  }
}
