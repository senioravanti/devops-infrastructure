# https://github.com/postgres/postgres/blob/master/src/backend/utils/misc/postgresql.conf.sample
listen_addresses = '*'

shared_buffers = 256MB
max_connections = 100
temp_buffers = 8MB

effective_cache_size = 8GB
maintenance_work_mem = 1GB
work_mem = 8MB

ssl = on
ssl_cert_file = '/etc/ssl/postgres/fullchain.pem'
ssl_key_file = '/etc/ssl/postgres/privkey.pem'

hba_file = '/usr/local/share/postgresql/pg_hba.conf'