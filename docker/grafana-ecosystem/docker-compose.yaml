# https://github.com/grafana/loki/blob/main/examples/getting-started/docker-compose.yaml
# https://oneuptime.com/blog/post/2026-01-21-loki-docker-compose/view
# docker compose config -> проверка подстановки переменных среды и проч.
name: grafana-ecosystem

# docker inspect ... | jq '.[0].NetworkSettings.Networks'
networks:
  loki:
    name: loki-net
    external: true
  alloy:
    name: alloy-net
    external: true
  garage:
    name: parkings-garage-net
    external: true
  grafana:
    name: grafana-net
    external: true
  parkings-postgres:
    name: parkings-postgres-net
    external: true

volumes:
  loki-read-data:
  loki-write-data:
  loki-backend-data:
  grafana-data:
  prometeus-data:

services:
  read:
    image: "grafana/loki:${LOKI_TAG}"
    command:
      - "-config.expand-env=true"
      - "-config.file=/etc/loki/config.yaml"
      - "-target=read"
    ports:
      - 3100
      - 7946
      - 9095
    volumes:
      - ./loki-config.yaml:/etc/loki/config.yaml
      - loki-read-data:/loki
    env_file:
      - ./.env.s3
    healthcheck:
      test: ["CMD", "/usr/bin/loki", "-health"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 2
    networks: &loki-dns
      default:
        aliases:
          - loki
      garage:

  write:
    image: "grafana/loki:${LOKI_TAG}"
    command:
      - "-config.expand-env=true"
      - "-config.file=/etc/loki/config.yaml"
      - "-target=write"
    ports:
      - 3100
      - 7946
      - 9095
    volumes:
      - ./loki-config.yaml:/etc/loki/config.yaml
      - loki-write-data:/loki
    healthcheck:
      test: ["CMD", "/usr/bin/loki", "-health"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 5
    env_file:
      - ./.env.s3
    networks:
      <<: *loki-dns

  pyroscope:
    image: "grafana/pyroscope:${PYROSCOPE_TAG}"
    # should not be published to the host machine
    expose: [4040]
    networks:
      default:

  # docker exec -it garage /garage key create loki-key
  # docker exec -it garage /garage bucket create loki-ruler
  # docker exec -it garage /garage bucket allow loki-ruler --key loki-key --read --write --owner
  # docker exec -it garage /garage bucket create loki-data
  # docker exec -it garage /garage bucket allow loki-data --key loki-key --read --write --owner

  grafana:
    # https://grafana.com/docs/grafana/latest/setup-grafana/configure-docker/
    image: "grafana/grafana:${GRAFANA_TAG}"
    volumes:
      - './grafana.ini:/etc/grafana/grafana.ini:ro'
      - './provisioning/datasources/:/etc/grafana/provisioning/datasources/'
      - 'grafana-data:/var/lib/grafana'
    depends_on:
      - gateway
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      default:
      grafana:
      parkings-postgres:

  backend:
    image: "grafana/loki:${LOKI_TAG}"
    volumes:
      - ./loki-config.yaml:/etc/loki/config.yaml
      - loki-backend-data:/loki
    env_file:
      - ./.env.s3
    ports:
      - 3100
      - 7946
    command:
      - "-config.expand-env=true"
      - "-config.file=/etc/loki/config.yaml"
      - "-target=backend"
      - "-legacy-read-mode=false"
    depends_on:
      - gateway
    healthcheck:
      test: ["CMD", "/usr/bin/loki", "-health"]
      start_period: 30s
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      default:
      garage:

  gateway:
    image: "nginx:${NGINX_TAG}"
    depends_on:
      - read
      - write
    entrypoint:
      - sh
      - -euc
      - |
        cat <<EOF > /etc/nginx/nginx.conf
        user  nginx;

        error_log  /dev/stderr;
        worker_processes  5;  ## Default: 1

        events {
          worker_connections   4096;
        }

        http {
          resolver 127.0.0.11;

          server {
            listen             3100;

            location = / {
              return 200 'OK';
              auth_basic off;
            }

            location = /api/prom/push {
              proxy_pass       http://write:3100\$$request_uri;
            }

            location = /api/prom/tail {
              proxy_pass       http://read:3100\$$request_uri;
              proxy_set_header Upgrade \$$http_upgrade;
              proxy_set_header Connection "upgrade";
            }

            location ~ /api/prom/.* {
              proxy_pass       http://read:3100\$$request_uri;
            }

            location = /loki/api/v1/push {
              proxy_pass       http://write:3100\$$request_uri;
            }

            location = /loki/api/v1/tail {
              proxy_pass       http://read:3100\$$request_uri;
              proxy_set_header Upgrade \$$http_upgrade;
              proxy_set_header Connection "upgrade";
            }

            location ~ /loki/api/.* {
              proxy_pass       http://read:3100\$$request_uri;
            }
          }
        }
        EOF
        /docker-entrypoint.sh nginx -g "daemon off;"
    ports:
      - "3100:3100"
    healthcheck:
      test: ["CMD", "service", "nginx", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      default:
      loki:
        aliases:
          - loki

  prometheus:
    container_name: prometheus
    image: "prom/prometheus:v${PROMETHEUS_TAG}-distroless"
    volumes:
      - './prometheus.yaml:/etc/prometheus/prometheus.yml:ro'
      - 'prometeus-data:/prometheus'
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-remote-write-receiver'
    ports:
      - '9090:9090'
    networks:
      default:

  # Аналог promtail, который EOL (не поддерживается).
  # Агент сбора телеметрии
  # Телеметрия -- передача информации, подлежащей измерению
  alloy:
    image: "grafana/alloy:v${ALLOY_TAG}"
    privileged: true
    pid: host
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command:
      - run
      - "--server.http.listen-addr=0.0.0.0:12345"
      - "--storage.path=/var/lib/alloy/data"
      - /etc/alloy/config.alloy
    ports:
      - 12345:12345
    depends_on:
      - gateway
      - prometheus
    networks:
      default:
      alloy:
        aliases:
          - alloy
